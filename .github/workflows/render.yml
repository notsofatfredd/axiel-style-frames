name: Render frames

# Full-size deliverable PNGs on GitHub's runners (software WebGL), so the laptop's memory is not involved.
# One parallel job per frame (software GL is slow at 2560×1440), then one job merges PNGs and logs into
# a gallery, then Pages gets the harness plus /gallery/. Pages only updates when every frame passed on a
# full run, so the public link always shows the last good set.
on:
  workflow_dispatch:
    inputs:
      frames:
        description: 'Only these frames, comma separated (e.g. SF-03,SF-07b). Empty = all. Partial runs never deploy.'
        required: false
        default: ''
  push:
    paths: ['js/**', 'index.html', 'cartographer.html', 'objects.html', 'animatic.html', 'assets/**', 'tools/**', '.github/workflows/render.yml']

# Runners pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, which the pinned
# Playwright's --with-deps install may not support. Move both together, on purpose, in one push.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frames: ${{ steps.m.outputs.frames }}
    steps:
      - id: m
        env:
          PICK: ${{ github.event.inputs.frames }}
        run: |
          ALL='SF-01,SF-02,SF-03,SF-04,SF-05,SF-06,SF-07,SF-07b,SF-08'
          LIST="${PICK:-$ALL}"
          echo "frames=$(python3 -c "import json,sys; print(json.dumps([s.strip() for s in sys.argv[1].split(',') if s.strip()]))" "$LIST")" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    # slowest frame is about 3 min; render.mjs gives up on a stuck frame at 15 min
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frame: ${{ fromJSON(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve and render ${{ matrix.frame }}
        env:
          FRAMES: ${{ matrix.frame }}
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/index.html && break; sleep 1; done
          node tools/render.mjs http://127.0.0.1:8000/index.html renders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-${{ matrix.frame }}
          path: renders/
          retention-days: 7

  carto:
    # G2-6 silhouette test: flat-black turnarounds and the K7 / K8 framings as PNGs, gated on the §3.1 budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve and capture cartographer.html
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/cartographer.html && break; sleep 1; done
          node tools/carto.mjs http://127.0.0.1:8000/cartographer.html carto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carto
          path: carto/
          retention-days: 7

  objects:
    # G3 hero objects: every §3.2 object counted against its budget, lit turnarounds as PNGs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve and capture objects.html
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/objects.html && break; sleep 1; done
          node tools/objects.mjs http://127.0.0.1:8000/objects.html objects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects
          path: objects/
          retention-days: 7

  animatic:
    # G4 grey-box animatic: storyboard per key, MP4 fly-through (desktop + phone), plot map, clearance report
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium and ffmpeg (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
          command -v ffmpeg || { for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && break; echo "retry $i"; sleep 15; done; }
          ffmpeg -version | head -1
      - name: Serve and capture animatic.html
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/animatic.html && break; sleep 1; done
          node tools/animatic.mjs http://127.0.0.1:8000/animatic.html animatic
          cat animatic/clearance.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animatic
          path: animatic/
          retention-days: 7

  collect:
    needs: [render, carto, objects, animatic]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: frame-*
          path: parts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: carto
          path: carto
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: objects
          path: objects
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: animatic
          path: animatic
      - name: Build gallery
        run: |
          pip install --quiet pillow
          python tools/gallery.py parts gallery ${{ github.run_number }} carto objects animatic
          sed '1s/^\xEF\xBB\xBF//' gallery/render-log.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: axiel-g2-frames-${{ github.run_number }}
          path: gallery/
          retention-days: 30

  deploy:
    # default success(): skipped if any frame failed or went over budget, so Pages keeps the last good set.
    # Only the gallery branch deploys (repo variable GALLERY_BRANCH, else worktree-g2-v14): side branches
    # render and upload artifacts for review without overwriting the public gallery.
    needs: [render, carto, objects, animatic, collect]
    if: ${{ success() && !github.event.inputs.frames && github.ref_name == (vars.GALLERY_BRANCH || 'worktree-g2-v14') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}gallery/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: axiel-g2-frames-${{ github.run_number }}
          path: gallery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
