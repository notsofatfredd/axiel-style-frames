name: Render frames

# Full-size deliverable PNGs on GitHub's runners (software WebGL), so the laptop's memory is not involved.
# One parallel job per frame (software GL is slow at 2560×1440), then one job merges PNGs and logs into
# a gallery, then Pages gets the harness plus /gallery/. Pages only updates when every frame passed on a
# full run, so the public link always shows the last good set.
on:
  workflow_dispatch:
    inputs:
      frames:
        description: 'Only these frames, comma separated (e.g. SF-03,SF-07b). Empty = all. Partial runs never deploy.'
        required: false
        default: ''
  push:
    paths: ['js/**', 'index.html', 'cartographer.html', 'objects.html', 'animatic.html', 'assets.html', 'assets/**', 'tools/**', 'site/**', '.github/workflows/render.yml']

# Runners pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, which the pinned
# Playwright's --with-deps install may not support. Move both together, on purpose, in one push.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frames: ${{ steps.m.outputs.frames }}
    steps:
      - id: m
        env:
          PICK: ${{ github.event.inputs.frames }}
        run: |
          ALL='SF-01,SF-02,SF-03,SF-04,SF-05,SF-06,SF-07,SF-07b,SF-08'
          LIST="${PICK:-$ALL}"
          echo "frames=$(python3 -c "import json,sys; print(json.dumps([s.strip() for s in sys.argv[1].split(',') if s.strip()]))" "$LIST")" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    # slowest frame is about 3 min; render.mjs gives up on a stuck frame at 15 min
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frame: ${{ fromJSON(needs.plan.outputs.frames) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve and render ${{ matrix.frame }}
        env:
          FRAMES: ${{ matrix.frame }}
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/index.html && break; sleep 1; done
          node tools/render.mjs http://127.0.0.1:8000/index.html renders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-${{ matrix.frame }}
          path: renders/
          retention-days: 7

  carto:
    # G2-6 silhouette test: flat-black turnarounds and the K7 / K8 framings as PNGs, gated on the §3.1 budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve and capture cartographer.html
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/cartographer.html && break; sleep 1; done
          node tools/carto.mjs http://127.0.0.1:8000/cartographer.html carto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carto
          path: carto/
          retention-days: 7

  objects:
    # G3 hero objects: every §3.2 object counted against its budget, lit turnarounds as PNGs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve and capture objects.html
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/objects.html && break; sleep 1; done
          node tools/objects.mjs http://127.0.0.1:8000/objects.html objects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects
          path: objects/
          retention-days: 7

  animatic:
    # G4 grey-box animatic: storyboard per key, MP4 fly-through (desktop + phone), plot map, clearance report
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium and ffmpeg (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
          command -v ffmpeg || { for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && break; echo "retry $i"; sleep 15; done; }
          ffmpeg -version | head -1
      - name: Serve and capture animatic.html
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/animatic.html && break; sleep 1; done
          node tools/animatic.mjs http://127.0.0.1:8000/animatic.html animatic
          cat animatic/clearance.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animatic
          path: animatic/
          retention-days: 7

  proto:
    # G6 technical prototype (AMOS): Next.js static export of site/ under the Pages path, checked in headless Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_BASE_PATH: /axiel-style-frames/proto
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the static export
        working-directory: site
        run: |
          for i in 1 2 3; do npm ci --no-audit --no-fund && break; echo "retry $i"; sleep 15; done
          npm run build
          npm run typecheck
      - name: Install Playwright Chromium (retries network blips)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Serve under the base path and check
        run: |
          mkdir -p srv/axiel-style-frames && cp -r site/out srv/axiel-style-frames/proto
          python3 -m http.server 8000 --bind 127.0.0.1 --directory srv > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/axiel-style-frames/proto/ && break; sleep 1; done
          node tools/proto.mjs http://127.0.0.1:8000/axiel-style-frames/proto/ proto
      - name: Summary
        if: always()
        run: cat proto/proto.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proto
          path: proto/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: proto-site
          path: site/out/
          retention-days: 7

  assets:
    # G7 assets: every static prop exported from its kit to GLB, ambient occlusion baked in Blender where the
    # geometry is static, Draco + KTX2, then each GLB rendered beside the kit that made it and gated on the match
    # and the §7.2 budgets. Nothing is committed: the GLBs are rebuilt from the kits on every run.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright, gltf-transform, validator (one npm call, so nothing prunes the rest)
        run: |
          for i in 1 2 3; do npm i --no-save --no-package-lock playwright@1.48.2 three@0.169.0 @gltf-transform/cli@4.5.1 @gltf-transform/core@4.5.1 @gltf-transform/functions@4.5.1 @gltf-transform/extensions@4.5.1 draco3dgltf@1.5.7 gltf-validator@2.0.0-dev.3.10 pngjs@7 && break; echo "retry $i"; sleep 15; done
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
      - name: Install KTX-Software 4.4.2
        run: |
          for i in 1 2 3; do curl -fsSL -o /tmp/ktx.deb https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb && break; echo "retry $i"; sleep 15; done
          sudo apt-get install -y /tmp/ktx.deb
          ktx --version
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3-linux-x64
      - name: Install Blender 4.2.3 LTS (headless, bake only)
        run: |
          if [ ! -x ~/blender/blender ]; then
            for i in 1 2 3; do curl -fsSL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz && break; echo "retry $i"; sleep 15; done
            tar -xJf /tmp/blender.tar.xz -C ~ && mv ~/blender-4.2.3-linux-x64 ~/blender
          fi
          sudo apt-get install -y libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libgl1 libegl1
          ~/blender/blender --version | head -1
      - name: Export the kits to raw GLB
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/assets.html && break; sleep 1; done
          node tools/assets.mjs export http://127.0.0.1:8000/assets.html g7/raw
      - name: Bake ambient occlusion (Blender, Cycles CPU)
        run: ~/blender/blender -b --factory-startup --python-exit-code 1 --python tools/bake.py -- g7/raw/manifest.json g7/raw g7/bake 128
      - name: Pack (lightmaps, Draco, KTX2, validator, budgets)
        run: node tools/pack.mjs g7/raw g7/bake glb
      - name: Verify the packed GLBs against the kits
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8000/glb/manifest.json && break; sleep 1; done
          mkdir -p g7check && cp g7/bake/*.png g7check/ 2>/dev/null || true
          node tools/assets.mjs verify http://127.0.0.1:8000/assets.html g7check glb
      - name: Summary
        if: always()
        run: cat g7check/assets.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no G7 report" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7check
          path: g7check/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: glb
          path: glb/
          retention-days: 7

  collect:
    needs: [render, carto, objects, animatic, proto, assets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: frame-*
          path: parts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: carto
          path: carto
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: objects
          path: objects
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: animatic
          path: animatic
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: proto
          path: proto
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g7check
          path: g7check
      - name: Build gallery
        run: |
          pip install --quiet pillow
          python tools/gallery.py parts gallery ${{ github.run_number }} carto objects animatic proto g7check
          sed '1s/^\xEF\xBB\xBF//' gallery/render-log.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: axiel-g2-frames-${{ github.run_number }}
          path: gallery/
          retention-days: 30

  deploy:
    # default success(): skipped if any frame failed or went over budget, so Pages keeps the last good set.
    # Only the gallery branch deploys (repo variable GALLERY_BRANCH, else worktree-g2-v14): side branches
    # render and upload artifacts for review without overwriting the public gallery.
    needs: [render, carto, objects, animatic, proto, assets, collect]
    if: ${{ success() && !github.event.inputs.frames && github.ref_name == (vars.GALLERY_BRANCH || 'worktree-g2-v14') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}gallery/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: axiel-g2-frames-${{ github.run_number }}
          path: gallery
      - uses: actions/download-artifact@v4
        with:
          name: proto-site
          path: proto
      - uses: actions/download-artifact@v4
        with:
          name: glb
          path: glb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
